services:
  postgres:
    image: postgres:16-alpine
    container_name: marealerta_pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: marealerta_dev
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    volumes:
      - marealerta_pg_data:/var/lib/postgresql/data

volumes:
  marealerta_pg_data: