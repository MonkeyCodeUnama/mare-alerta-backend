services:
  postgres:
    image: postgres:16-alpine
    container_name: marealerta_pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: marealerta_dev
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    volumes:
      - marealerta_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marealerta_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: marealerta_whatsapp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      - SERVER_URL=http://localhost:8081
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-marealerta_secret_key_2026}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:password@postgres:5432/marealerta_dev?schema=evolution
      - DATABASE_CONNECTION_CLIENT_NAME=marealerta_evolution
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    volumes:
      - evolution_instances:/evolution/instances

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marealerta_app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/marealerta_dev
      DB_USER: postgres
      DB_PASSWORD: password
      JWT_KEY: ${JWT_KEY:-MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
      WHATSAPP_API_URL: http://evolution_api:8080
      WHATSAPP_API_KEY: ${EVOLUTION_API_KEY:-marealerta_secret_key_2026}
      WHATSAPP_INSTANCIA: marealerta_belem

volumes:
  marealerta_pg_data:
  evolution_instances:
