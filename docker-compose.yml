services:
  postgres:
    image: postgres:16-alpine
    container_name: marealerta_pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: marealerta_dev
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    volumes:
      - marealerta_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marealerta_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marealerta_app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/marealerta_dev
      DB_USER: postgres
      DB_PASSWORD: password
      JWT_KEY: ${JWT_KEY:-MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}

volumes:
  marealerta_pg_data:
