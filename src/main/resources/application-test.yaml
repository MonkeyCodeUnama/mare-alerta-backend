spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marealerta_test}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

security:
  rate-limit:
    capacity: 10000
    refill-tokens: 10000
    refill-duration-seconds: 1
