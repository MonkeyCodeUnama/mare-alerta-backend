spring:
  application:
    name: backend
jwt:
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  key: ${JWT_KEY}
app:
  uploads:
    ocorrencias-dir: /app/uploads/ocorrencias

security:
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:60}
    refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:60}
    refill-duration-seconds: ${RATE_LIMIT_REFILL_DURATION_SECONDS:60}

whatsapp:
  evolution:
    url: ${WHATSAPP_API_URL}
    api-key: ${WHATSAPP_API_KEY}
    instancia: ${WHATSAPP_INSTANCIA:marealerta_belem}

ia:
  chuva:
    url: ${IA_CHUVA_URL:http://weather-model:8000/v1/predict}
    api-key: ${IA_CHUVA_API_KEY:}
