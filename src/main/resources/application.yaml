spring:
  application:
    name: backend
  profiles:
    active: dev
jwt:
  expiration: ${JWT_EXPIRATION:9000000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  key: ${JWT_KEY:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
app:
  uploads:
    ocorrencias-dir: /app/uploads/ocorrencias
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}

security:
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:60}
    refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:60}
    refill-duration-seconds: ${RATE_LIMIT_REFILL_DURATION_SECONDS:60}

whatsapp:
  evolution:
    url: ${WHATSAPP_API_URL:http://localhost:8081}
    api-key: ${WHATSAPP_API_KEY:marealerta_secret_key_2026}
    instancia: ${WHATSAPP_INSTANCIA:marealerta_belem}

ia:
  chuva:
    url: ${IA_CHUVA_URL:http://127.0.0.1:8000/v1/predict}