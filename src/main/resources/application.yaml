spring:
  application:
    name: backend
  profiles:
    active: dev
jwt:
  expiration: ${JWT_EXPIRATION:9000000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  key: ${JWT_KEY:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
app:
