spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/marealerta_dev
    username: postgres
    password: password

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        '[format_sql]': true

  logging:
    level:
      org:
        springframework:
          security: DEBUG
jwt:
  expiration: ${JWT_EXPIRATION:9000000}
  key: ${JWT_KEY:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
